<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f6f2ec;
  --ink-soft:rgba(246,242,236,.72);
  --glass:rgba(18,16,28,.42);
  --line:rgba(246,242,236,.22);
  --go:#7fd1c7;
  --stop:#ff7a7a;
}

*{ margin:0; padding:0; box-sizing:border-box; }

html,body{ height:100%; }

body{
  font-family:'Outfit','Segoe UI',sans-serif;
  color:var(--ink);
  overflow:hidden;
  background:#1b1830;
}

#wrapper{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  padding:24px clamp(16px,4vw,48px) 32px;
  background-color:#1b1830;
  background-image:linear-gradient(160deg,#2a2550,#0f1b2e);
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  transition:background-image 1s ease;
  position:relative;
}

/* darken the photo so the white text always reads */
#wrapper::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,rgba(10,8,20,.55),rgba(10,8,20,.25) 45%,rgba(10,8,20,.6));
  pointer-events:none;
}
#wrapper > *{ position:relative; }

#container{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

#dairy,#sign{
  font-size:18px;
  font-weight:500;
  letter-spacing:.02em;
  cursor:pointer;
  color:var(--ink-soft);
  padding:8px 4px;
  border-bottom:1px solid transparent;
  transition:color .2s, border-color .2s;
}
#dairy:hover,#sign:hover{
  color:var(--ink);
  border-color:var(--ink);
}

/* quote area: reserved space so the clock never jumps */
#quoteBox{
  width:min(900px,100%);
  min-height:150px;
  margin:28px auto 0;
  padding:22px 30px;
  border-radius:18px;
  background:var(--glass);
  border:1px solid var(--line);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  text-align:center;
  opacity:0;
  transform:translateY(-6px);
  transition:opacity .6s ease, transform .6s ease;
}
#quoteBox.show{ opacity:1; transform:none; }

#heading{
  font-family:'Instrument Serif',Georgia,serif;
  font-weight:400;
  font-size:clamp(22px,3vw,34px);
  line-height:1.3;
}
#writer{
  margin-top:12px;
  font-size:16px;
  font-weight:300;
  color:var(--ink-soft);
}

#stage{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:26px;
}

#time{
  font-size:clamp(72px,17vw,250px);
  font-weight:700;
  line-height:1;
  letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
  text-shadow:0 0 30px rgba(255,255,255,.35);
}

#press{
  display:flex;
  gap:20px;
}

#start,#stop{
  height:68px;
  min-width:160px;
  padding:0 28px;
  font-family:inherit;
  font-size:26px;
  font-weight:500;
  color:#10101a;
  border:none;
  border-radius:34px;
  cursor:pointer;
  transition:transform .15s, filter .15s;
}
#start{ background:var(--go); }
#stop{ background:var(--stop); }
#start:hover,#stop:hover{ filter:brightness(1.1); transform:translateY(-2px); }
#start:active,#stop:active{ transform:none; }

/* set the clock */
#setter{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 14px;
  border-radius:40px;
  background:var(--glass);
  border:1px solid var(--line);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
#setter label{
  font-size:16px;
  color:var(--ink-soft);
  margin-right:4px;
}
#setter input{
  width:62px;
  height:42px;
  text-align:center;
  font-family:inherit;
  font-size:20px;
  font-variant-numeric:tabular-nums;
  color:var(--ink);
  background:rgba(255,255,255,.08);
  border:1px solid var(--line);
  border-radius:12px;
}
#setter input:focus{ outline:2px solid var(--go); outline-offset:1px; }
#setter button{
  height:42px;
  padding:0 20px;
  font-family:inherit;
  font-size:18px;
  font-weight:500;
  color:var(--ink);
  background:transparent;
  border:1px solid var(--ink);
  border-radius:21px;
  cursor:pointer;
  transition:background .2s, color .2s;
}
#setter button:hover{ background:var(--ink); color:#10101a; }

button:focus-visible{ outline:2px solid var(--ink); outline-offset:3px; }

@media (max-width:640px){
  #press{ gap:12px; }
  #start,#stop{ min-width:120px; height:56px; font-size:22px; }
  #setter{ flex-wrap:wrap; justify-content:center; border-radius:24px; }
}
@media (prefers-reduced-motion:reduce){
  *{ transition:none !important; }
}
</style>
</head>
<body>
<div id="wrapper">

  <div id="container">
    <div id="dairy">Daily quotes</div>
    <div id="sign">Sign in</div>
  </div>

  <div id="quoteBox" aria-live="polite">
    <h1 id="heading"></h1>
    <h2 id="writer"></h2>
  </div>

  <div id="stage">
    <div id="time">0:00:00</div>

    <div id="press">
      <button id="start">Start</button>
      <button id="stop">Stop</button>
    </div>

    <div id="setter">
      <label for="setH">Set clock</label>
      <input id="setH" type="number" min="0" max="99" placeholder="hh" />
      <input id="setM" type="number" min="0" max="59" placeholder="mm" />
      <input id="setS" type="number" min="0" max="59" placeholder="ss" />
      <button id="setBtn">Set</button>
    </div>
  </div>

</div>

<script>
const time    = document.getElementById("time");
const start   = document.getElementById("start");
const stop    = document.getElementById("stop");
const dairy   = document.getElementById("dairy");
const heading = document.getElementById("heading");
const writer  = document.getElementById("writer");
const quoteBox= document.getElementById("quoteBox");
const wrapper = document.getElementById("wrapper");

const setH = document.getElementById("setH");
const setM = document.getElementById("setM");
const setS = document.getElementById("setS");
const setBtn = document.getElementById("setBtn");

/* ---------- clock ---------- */
let total = 0;          
let timer = null;


const QUOTE_AT = [10, 20, 30];

function pad(n){ return String(n).padStart(2, "0"); }

function render(){
  const hr  = Math.floor(total / 3600);
  const min = Math.floor((total % 3600) / 60);
  const sec = total % 60;
  time.textContent = `${hr}:${pad(min)}:${pad(sec)}`;
}

function tick(){
  total++;
  render();
  if (QUOTE_AT.includes(total)) showQuote();
}

start.addEventListener("click", () => {
  if (timer) return;                 // already running
  timer = setInterval(tick, 1000);   // a real second
});

stop.addEventListener("click", () => {
  clearInterval(timer);
  timer = null;
  total = 0;
  render();
});

/* ---------- set the clock ---------- */
setBtn.addEventListener("click", () => {
  const h = Math.max(0, parseInt(setH.value) || 0);
  const m = Math.min(59, Math.max(0, parseInt(setM.value) || 0));
  const s = Math.min(59, Math.max(0, parseInt(setS.value) || 0));
  total = h * 3600 + m * 60 + s;
  render();
});

/* ---------- quotes ---------- */
let quotes = null;   

async function loadQuotes(){
  if (quotes) return quotes;
  const response = await fetch("https://echoes.soferity.com/api/quotes");
  if (!response.ok) throw new Error("could not fetch the information");
  const data = await response.json();
  quotes = data.data;
  return quotes;
}

async function showQuote(){
  try{
    const list = await loadQuotes();
    const pick = list[Math.floor(Math.random() * list.length)];
    heading.textContent = pick.quote;
    writer.textContent  = pick.author;
    quoteBox.classList.add("show");
  }
  catch(error){
    console.error(error);
  }
}

dairy.addEventListener("click", showQuote);

/* ---------- background slideshow ---------- */
const piks = ["download","492649955325340","10907224094183318",
"13229392654504961 (1)","956592777190909879","Berserk",
"Desktop wallpaper - Serene mountain road (4)","download (10)","download (11)",
"download (12)","download (13)","download (14)","download (15)","download (16)",
"download (17)","download (18)","download (19)"];

let slides = 0;

function setBackground(){
  
  wrapper.style.backgroundImage =
    `url("${piks[slides]}.jpg"), linear-gradient(160deg,#2a2550,#0f1b2e)`;
}
setBackground();

setInterval(() => {
  slides = (slides + 1) % piks.length;   
  setBackground();
}, 15000);
</script>
</body>
</html>
